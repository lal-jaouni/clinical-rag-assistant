pubmed:
  mesh_terms:
    - "Massive Transfusion"
    - "Hemorrhagic Shock/therapy"
    - "Resuscitation/methods"
    - "Tranexamic Acid/therapeutic use"
    - "Blood Transfusion/methods"
    - "Damage Control Resuscitation"
    - "Hemostatic Resuscitation"
  max_per_term: 100
  date_range_start: 2010
  cache_dir: "/tmp/pubmed_cache"
  api_key: null  # Set via environment variable ENTREZ_API_KEY

fda:
  cache_dir: "/tmp/fda_cache"
  # Each entry is a PDF manifest: doc_id is the stable source_id stored in
  # documents.source_id (unique with source_type="fda"). URLs point at the
  # FDA's public guidance PDFs. Add local_path: <abs path> to bypass the
  # network (useful for air-gapped runs or when FDA rotates download URLs).
  documents:
    - doc_id: "gmlp-2021"
      title: "Good Machine Learning Practice for Medical Device Development: Guiding Principles"
      doc_type: "Guiding Principles"
      issuance_date: "2021-10-27"
      url: "https://www.fda.gov/media/153486/download"
    - doc_id: "aiml-samd-action-plan-2021"
      title: "Artificial Intelligence/Machine Learning (AI/ML)-Based Software as a Medical Device (SaMD) Action Plan"
      doc_type: "Action Plan"
      issuance_date: "2021-01-12"
      url: "https://www.fda.gov/media/145022/download"
    - doc_id: "pccp-final-2024"
      title: "Predetermined Change Control Plans for Machine Learning-Enabled Medical Devices"
      doc_type: "Final Guidance"
      issuance_date: "2024-12-04"
      url: "https://www.fda.gov/media/166704/download"
    - doc_id: "cds-final-2022"
      title: "Clinical Decision Support Software (Final Guidance)"
      doc_type: "Final Guidance"
      issuance_date: "2022-09-28"
      url: "https://www.fda.gov/media/109618/download"
    - doc_id: "samd-clinical-evaluation-2017"
      title: "Software as a Medical Device (SAMD): Clinical Evaluation"
      doc_type: "Final Guidance"
      issuance_date: "2017-12-08"
      url: "https://www.fda.gov/media/100714/download"

clinical_trials:
  # CT.gov v2 API condition queries. These are matched via query.cond=, which
  # searches the conditions, keywords, and title fields. Narrower than the
  # PubMed MeSH set because CT.gov tags are more heterogeneous and a broad MeSH
  # term often pulls unrelated trials.
  conditions:
    - "massive transfusion"
    - "hemorrhagic shock"
    - "damage control resuscitation"
    - "tranexamic acid trauma"
    - "trauma hemorrhage"
  # Per-condition result cap. v2 API default pageSize is 10; we paginate.
  max_per_condition: 100
  # Trial status filter passed to filter.overallStatus. Empty list = all statuses.
  # Completed + active trials are most useful for evidence synthesis; recruiting
  # trials give forward-looking protocols.
  statuses:
    - "COMPLETED"
    - "ACTIVE_NOT_RECRUITING"
    - "RECRUITING"
  # Minimum start year. Set to null for no lower bound.
  start_date_from: 2010

chunking:
  chunk_size: 200  # tokens
  overlap: 50
  separator: "."  # sentence-level splitting
