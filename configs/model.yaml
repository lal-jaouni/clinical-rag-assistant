embedding:
  model: "pubmedbert-base-uncased-abstract"
  # Alternative: "dmis-lab/biobert-v1.1", "ncbi/MedCPT-Article-Encoder"
  device: "cpu"  # set to "cuda" if you have a GPU
  batch_size: 32

llm:
  # LiteLLM-format model string. Examples:
  #   ollama/llama3.1:8b                       (default, self-hosted)
  #   ollama/granite3.1-dense:2b               (lightweight fallback)
  #   anthropic/claude-3-5-sonnet-20241022     (requires ANTHROPIC_API_KEY)
  #   openai/gpt-4o-mini                       (requires OPENAI_API_KEY)
  #   groq/llama-3.1-70b-versatile             (requires GROQ_API_KEY)
  # Override via LLM_MODEL env var in .env.
  model: "ollama/llama3.1:8b"
  temperature: 0.1  # low for clinical safety (less variance in answers)
  max_tokens: 500
  top_p: 0.9
  # Extra provider kwargs (e.g. api_base for self-hosted Ollama)
  provider_kwargs: {}

safety:
  confidence_threshold: 0.7
  source_grounding_threshold: 0.85
  max_hallucination_rate: 0.02
