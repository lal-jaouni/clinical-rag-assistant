vector_search:
  metric: "cosine"  # or "euclidean"
  top_k: 5

bm25:
  enabled: true
  top_k: 3

hybrid_fusion:
  enabled: true
  vector_weight: 0.6
  bm25_weight: 0.4
  fusion_method: "rrf"  # reciprocal rank fusion

reranker:
  enabled: false  # Optional, improves precision
  model: "cross-encoder/qnli-distilroberta-base"
  threshold: 0.5

metadata_filters:
  date_range: 2015  # Only documents after year 2015
  source_types:
    - "pubmed"
    - "fda"
    - "clinical_trials"

query_expansion:
  enabled: false  # Optional, expands queries with synonyms
