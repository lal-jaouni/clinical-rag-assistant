[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-rag-assistant"
version = "0.1.0-alpha"
description = "Clinical-grade RAG system for acute care (MTP focus) with hallucination tracking and source attribution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Laith Al-Jaouni"}]

dependencies = [
    # LLM interface (unified for Ollama, Anthropic, OpenAI, Groq, etc.)
    "litellm>=1.48.0",
    # Embeddings
    "sentence-transformers>=2.7.0",
    "torch>=2.2.0",
    # Vector store
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",
    # Document loaders
    "requests>=2.31.0",
    "pdfplumber>=0.11.0",
    # Retrieval
    "rank-bm25>=0.2.2",
    # Config + data
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    # API + UI
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "streamlit>=1.33.0",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.1.7",
    "datasets>=2.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
