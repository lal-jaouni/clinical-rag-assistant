services:
  # PostgreSQL with pgvector extension for vector storage + metadata
  postgres:
    image: pgvector/pgvector:pg16
    container_name: clinical-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinical_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_localdev}
      POSTGRES_DB: ${POSTGRES_DB:-clinical_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinical_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Ollama for local LLM inference (default LLM backend)
  # Pull models after startup:
  #   docker exec clinical-rag-ollama ollama pull llama2:7b
  ollama:
    image: ollama/ollama:latest
    container_name: clinical-rag-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to enable GPU acceleration (requires NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Clinical RAG API
  api:
    build: .
    container_name: clinical-rag-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinical_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_localdev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-clinical_rag}
      OLLAMA_HOST: http://ollama:11434
      RAG_MODEL: ${RAG_MODEL:-ollama/llama3.1:8b}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  ollama_data:
